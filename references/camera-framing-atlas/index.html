<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="카메라 프레이밍, 렌즈, 환경을 직접 만든 도식으로 비교하는 33개 갤러리">
  <title>Camera Framing Atlas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#gallery">본문으로 건너뛰기</a>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">CAMERA STUDIES / 33 MAPS</p>
        <h1>Camera Framing Atlas</h1>
        <p class="intro">인물, 카메라, 공간의 관계를 한 화면에서 비교하는 독립 개념 도식입니다. 원본 영상이나 영화 장면을 복제하지 않습니다.</p>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">어두운 화면</button>
    </header>

    <section class="controls" aria-label="갤러리 필터">
      <label class="search-label" for="search">검색</label>
      <input id="search" type="search" placeholder="한국어, English, ID 검색" autocomplete="off">
      <div class="filters" role="group" aria-label="종류">
        <button class="filter active" type="button" data-kind="all" aria-pressed="true">전체 <span id="count-all">33</span></button>
        <button class="filter" type="button" data-kind="framing" aria-pressed="false">구도 <span id="count-framing">0</span></button>
        <button class="filter" type="button" data-kind="optics" aria-pressed="false">광학/환경 <span id="count-optics">0</span></button>
      </div>
      <p id="result-count" class="result-count" aria-live="polite">33개</p>
    </section>

    <main id="gallery" tabindex="-1">
      <div id="cards" class="cards"></div>
      <div id="empty" class="empty" hidden>검색 결과가 없습니다.</div>
    </main>

    <footer>
      <span>직접 만든 Canvas 도식 · optical effects are approximate</span>
      <a href="https://github.com/seungwonme/camera-gallery" rel="noreferrer">GitHub 저장소</a>
    </footer>
  </div>
  <script src="preview-camera-framing.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
